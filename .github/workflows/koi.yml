name: Generate Git-Koi GIF

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Generate git-koi GIF
        uses: yalongwastaken/git-koi@main
        with:
          login: ${{ github.repository_owner }}
          output-dir: assets/koi

      - name: Overlay Koi onto Banner
        run: |
          ffmpeg -y \
            -stream_loop -1 -i assets/banner.gif \
            -stream_loop -1 -i assets/koi/koi.gif \
            -filter_complex "\
              [0:v]crop=iw:ih*0.6:0:ih*0.2[cropped_bg]; \
              [cropped_bg][1:v]overlay=(W-w)/2:(H-h)/2:shortest=1" \
            -t 4 assets/banner_koi.gif

      - name: Commit and push GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Update git-koi banner" || echo "No changes to commit"
          git push
