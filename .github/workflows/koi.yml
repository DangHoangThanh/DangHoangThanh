name: Generate Git-Koi GIF

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate git-koi GIF
        uses: yalongwastaken/git-koi@main
        with:
          login: ${{ github.repository_owner }}
          output-dir: assets/koi

      - name: Commit and push GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/koi/
          git commit -m "Update git-koi animation" || echo "No changes to commit"
          git push
